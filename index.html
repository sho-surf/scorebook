    function inningPlayed(si, i) {
        // Bug7修正：進行位置・スコア・打席記録のいずれかで「攻撃済み」を堅牢に判定。
        // 延長スクロール時も実イニングindexで評価するためズレない。
        if (i < inn)

        const sv = scores[si] && scores[si][i];
        if (sv !== undefined && sv !== "")
            return true;
        for (let bi = 0; bi < LS; bi++) {

    function teamStats(si) {
        return Array.from({ length: LS }, (_, bi) => {
            const st = { ab: 0, h: 0, b1: 0, b2: 0, b3: 0, hr: 0, r: 0, rbi: 0, sac: 0, sf: 0, bb: 0, k: 0 };
            for (let i = 0; i < INNINGS; i++) {
                const arr = abs[si][i][bi];
                for (const a of arr) {
                    const res = a.result || autoRes(a.pitches);
                    if (!res)
                        continue;
                    const m = RM[res] || {};
                    if (m.isHit) {
                        st.ab++;
                        st.h++;
                        if (res === "1B" || res === "BH")
                            st.b1++;
                        else if (res === "2B")
                            st.b2++;
                        else if (res === "3B")
                            st.b3++;
                        else if (res === "HR" || res === "RHR")
                            st.hr++;
                    }
                    else if (m.isWalk)
                        st.bb++;
                    else if (res === "SAC")
                        st.sac++;
                    else if (res === "SF")
                        st.sf++;
                    else
                        st.ab++;
                    if (res === "K" || res === "Kc" || res === "KPB")
                        st.k++;
                    st.rbi += (a.rbi || 0);
                }
            }
            return st;
        });
    }
    function batHist(si, bi) {
        const list = [];

            const arr = abs[si][i][bi];
            arr.forEach((a, ai) => {
                const res = a.result || autoRes(a.pitches);

    function careerStats() {
        const byName = {};
        const ensure = nm => {
            if (!byName[nm])
                byName[nm] = { name: nm, games: new Set(), pa: 0, ab: 0, h: 0, b1: 0, b2: 0, b3: 0, hr: 0, r: 0, rbi: 0, sac: 0, sf: 0, bb: 0, k: 0, sb: 0, cs: 0, log: [],
                    dirHit: {}, dirOut: {} };
            return byName[nm];
        };
        games.forEach(g => {
            const gt = g.tournament || (g.data && g.data.tournament) || "";
            if (careerFilter !== "__all__") {
                if (careerFilter === "__none__") {
                    if (gt)
                        return;
                }
                else if (gt !== careerFilter)
                    return;
            }
            const d = g.data;
            if (!d || !d.teams || !d.lineups)
                return;
            const mine = (myTeamName || "").trim();
            const sides = [];
            if ((d.teams[0] || "").trim() === mine)
                sides.push(0);
            else if ((d.teams[1] || "").trim() === mine)
                sides.push(1); // Bug8修正:同名チーム対決でも片側のみ集計
            if (sides.length === 0)
                return;
            sides.forEach(si => {
                const lu = d.lineups[si] || [];
                for (let bi = 0; bi < LS; bi++) {
                    const nm = lu[bi] && lu[bi].name ? lu[bi].name.trim() : "";
                    if (!nm)
                        continue;
                    let played = false;
                    for (let i = 0; i < INNINGS; i++) {
                        const raw = (d.abs && d.abs[si] && d.abs[si][i] && d.abs[si][i][bi]);
                        if (!raw)
                            continue;
                        const arr = Array.isArray(raw) ? raw : [raw];
                        for (const a of arr) {
                            if (!a)
                                continue;
                            const res = a.result || autoRes(a.pitches || []);
                            if (!res)
                                continue;
                            played = true;
                            const st = ensure(nm);
                            const m = RM[res] || {};
                            const countsAB = (m.isHit || (!m.isWalk && res !== "SAC" && res !== "SF"));
                            if (m.isHit) {
                                st.ab++;
                                st.h++;
                                if (res === "1B" || res === "BH")
                                    st.b1++;
                                else if (res === "2B")
                                    st.b2++;
                                else if (res === "3B")
                                    st.b3++;
                                else if (res === "HR" || res === "RHR")
                                    st.hr++;
                                st.pa++;
                            }
                            else if (m.isWalk) {
                                st.bb++;
                                st.pa++;
                            }
                            else if (res === "SAC") {
                                st.sac++;
                                st.pa++;
                            }
                            else if (res === "SF") {
                                st.sf++;
                                st.pa++;
                            }
                            else {
                                st.ab++;
                                st.pa++;
                            }
                            if (res === "K" || res === "Kc" || res === "KPB")
                                st.k++;
                            st.rbi += (a.rbi || 0);
                            // 打球方向の集計（安打方向・アウト方向）
                            if (a.dir) {
                                if (m.isHit) {
                                    st.dirHit[a.dir] = (st.dirHit[a.dir] || 0) + 1;
                                }
                                else if (m.isOut) {
                                    st.dirOut[a.dir] = (st.dirOut[a.dir] || 0) + 1;
                                }
                            }
                            st.log.push({ game: g.title || g.id, inn: i + 1, res, ab: countsAB, h: !!m.isHit, rbi: a.rbi || 0, dir: a.dir || null });
                        }
                    }
                    if (played)
                        ensure(nm).games.add(g.id);
                }
                const sbl = d.sbLog || [];
                sbl.forEach(e => {
                    if (e.side !== si)
                        return;
                    if (e.runnerBat == null)
                        return;
                    const rp = lu[e.runnerBat];
                    const rnm = rp && rp.name ? rp.name.trim() : "";
                    if (!rnm)
                        return;
                    const st = ensure(rnm);
                    if (e.type === "SB")
                        st.sb++;
                    else if (e.type === "CS")
                        st.cs++;
                    st.games.add(g.id);
                });
            });
        });
        return Object.values(byName).map(s => (Object.assign(Object.assign({}, s), { g: s.games.size }))).sort((a, b) => b.pa - a.pa);
    }
    function pitcherCareerStats() {
        const byName = {};
        const ensure = nm => {
            if (!byName[nm])
                byName[nm] = { name: nm, games: new Set(), app: 0, pitches: 0, bf: 0, k: 0, bb: 0, hbp: 0, h: 0, hr: 0, r: 0 };
            return byName[nm];
        };
        games.forEach(g => {
            const gt = g.tournament || (g.data && g.data.tournament) || "";
            if (careerFilter !== "__all__") {
                if (careerFilter === "__none__") {
                    if (gt)
                        return;
                }
                else if (gt !== careerFilter)
                    return;
            }
            const d = g.data;
            if (!d || !d.teams || !d.lineups || !d.pitcherLog)
                return;
            const mine = (myTeamName || "").trim();
            const sides = [];
            if ((d.teams[0] || "").trim() === mine)
                sides.push(0);
            else if ((d.teams[1] || "").trim() === mine)
                sides.push(1); // Bug8修正:同名チーム対決でも片側のみ集計
            if (sides.length === 0)
                return;
            sides.forEach(si => {
                const ps = (d.pitcherLog || []).filter(p => p.side === si);
                if (!ps.length)
                    return;
                const oppSide = 1 - si;
                const segs = ps.map((p, idx) => ({
                    name: p.name ? p.name.trim() : "",
                    start: p.pitchesBefore != null ? p.pitchesBefore : 0,
                    end: ps[idx + 1] && ps[idx + 1].pitchesBefore != null ? ps[idx + 1].pitchesBefore : Infinity,
                }));
                segs.forEach(s => { if (s.name) {
                    const st = ensure(s.name);
                    st.app++;
                    st.games.add(g.id);
                } });
                let cum = 0;
                for (let i = 0; i < INNINGS; i++) {
                    let maxRounds = 0;
                    for (let bi = 0; bi < LS; bi++) {
                        const raw = d.abs && d.abs[oppSide] && d.abs[oppSide][i] && d.abs[oppSide][i][bi];
                        const arr = Array.isArray(raw) ? raw : (raw ? [raw] : []);
                        if (arr.length > maxRounds)
                            maxRounds = arr.length;
                    }
                    for (let r = 0; r < maxRounds; r++) {
                        for (let bi = 0; bi < LS; bi++) {
                            const raw = d.abs && d.abs[oppSide] && d.abs[oppSide][i] && d.abs[oppSide][i][bi];
                            const arr = Array.isArray(raw) ? raw : (raw ? [raw] : []);
                            const a = arr[r];
                            if (!a)
                                continue;
                            const np = (a.pitches || []).length;
                            const res = a.result || autoRes(a.pitches || []);
                            const seg = segs.find(s => cum >= s.start && cum < s.end) || segs[segs.length - 1];
                            if (seg && seg.name) {
                                const st = ensure(seg.name);
                                st.pitches += np;
                                if (res) {
                                    st.bf++;
                                    const m = RM[res] || {};
                                    if (res === "K" || res === "Kc" || res === "KPB")
                                        st.k++;
                                    if (res === "BB")
                                        st.bb++;
                                    if (m.isHit) {
                                        st.h++;
                                        if (res === "HR" || res === "RHR")
                                            st.hr++;
                                    }
                                    st.r += (a.rbi || 0);
                                }
                            }
                            cum += np;
                        }
                    }
                }
            });
        });
        return Object.values(byName).map(s => (Object.assign(Object.assign({}, s), { g: s.games.size }))).sort((a, b) => b.pitches - a.pitches);
    }
